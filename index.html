<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="构形 WebCAD：免费、离线可用的中文参数化单零件建模工具"
    />
    <title>构形 WebCAD</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <svg class="brand-mark" aria-hidden="true">
            <use href="#icon-cube"></use>
          </svg>
          <strong>构形 <span>WebCAD</span></strong>
        </div>
        <div class="project-actions">
          <button class="tool-button compact" data-action="new" title="新建工程">
            <svg><use href="#icon-file"></use></svg>
            <span>新建</span>
          </button>
          <button class="tool-button compact" data-action="example" title="载入四孔板">
            <svg><use href="#icon-template"></use></svg>
            <span>示例零件</span>
          </button>
          <button class="tool-button compact" data-action="save" title="保存到浏览器">
            <svg><use href="#icon-save"></use></svg>
            <span>保存工程</span>
          </button>
          <button class="icon-button" data-action="undo" title="撤销">
            <svg><use href="#icon-undo"></use></svg>
          </button>
          <button class="icon-button" data-action="redo" title="重做">
            <svg><use href="#icon-redo"></use></svg>
          </button>
        </div>
        <div class="topbar-spacer"></div>
        <button class="tool-button compact" data-action="project-export">
          <svg><use href="#icon-download"></use></svg>
          <span>工程 JSON</span>
        </button>
        <button class="tool-button compact" data-action="project-import">
          <svg><use href="#icon-upload"></use></svg>
          <span>导入</span>
        </button>
        <input id="project-file" type="file" accept=".json,application/json" hidden />
      </header>

      <nav class="ribbon" aria-label="建模工具栏">
        <div class="ribbon-tabs" role="tablist">
          <button class="ribbon-tab active" role="tab" aria-selected="true">草图</button>
          <button class="ribbon-tab" role="tab" aria-selected="false">特征</button>
        </div>
        <div class="ribbon-tools">
          <button class="ribbon-tool" data-tool="line">
            <svg><use href="#icon-line"></use></svg><span>线</span>
          </button>
          <button class="ribbon-tool" data-tool="rectangle">
            <svg><use href="#icon-rectangle"></use></svg><span>矩形</span>
          </button>
          <button class="ribbon-tool" data-tool="circle">
            <svg><use href="#icon-circle"></use></svg><span>圆</span>
          </button>
          <button class="ribbon-tool" data-tool="dimension">
            <svg><use href="#icon-dimension"></use></svg><span>尺寸</span>
          </button>
          <span class="ribbon-divider"></span>
          <button class="ribbon-tool" data-feature="extrude">
            <svg><use href="#icon-extrude"></use></svg><span>拉伸</span>
          </button>
          <button class="ribbon-tool" data-feature="revolve">
            <svg><use href="#icon-revolve"></use></svg><span>旋转</span>
          </button>
          <button class="ribbon-tool" data-feature="cut">
            <svg><use href="#icon-cut"></use></svg><span>切除</span>
          </button>
          <button class="ribbon-tool" data-feature="fillet">
            <svg><use href="#icon-fillet"></use></svg><span>圆角</span>
          </button>
          <button class="ribbon-tool" data-feature="chamfer">
            <svg><use href="#icon-chamfer"></use></svg><span>倒角</span>
          </button>
          <span class="ribbon-divider"></span>
          <button class="ribbon-tool" data-action="open-export">
            <svg><use href="#icon-export"></use></svg><span>导出</span>
          </button>
          <button class="ribbon-tool" data-action="print-check">
            <svg><use href="#icon-printer"></use></svg><span>打印自检</span>
          </button>
        </div>
      </nav>

      <aside class="left-panel">
        <section class="panel-section">
          <h2>草图工具</h2>
          <button class="side-tool" data-tool="line">
            <svg><use href="#icon-line"></use></svg><span>线</span><kbd>L</kbd>
          </button>
          <button class="side-tool" data-tool="rectangle">
            <svg><use href="#icon-rectangle"></use></svg><span>矩形</span><kbd>R</kbd>
          </button>
          <button class="side-tool" data-tool="circle">
            <svg><use href="#icon-circle"></use></svg><span>圆</span><kbd>C</kbd>
          </button>
          <button class="side-tool" data-tool="dimension">
            <svg><use href="#icon-dimension"></use></svg><span>尺寸</span><kbd>D</kbd>
          </button>
        </section>
        <section class="panel-section">
          <h2>特征工具</h2>
          <button class="side-tool" data-feature="extrude">
            <svg><use href="#icon-extrude"></use></svg><span>拉伸</span><kbd>E</kbd>
          </button>
          <button class="side-tool" data-feature="revolve">
            <svg><use href="#icon-revolve"></use></svg><span>旋转</span>
          </button>
          <button class="side-tool" data-feature="cut">
            <svg><use href="#icon-cut"></use></svg><span>切除</span>
          </button>
          <button class="side-tool" data-feature="fillet">
            <svg><use href="#icon-fillet"></use></svg><span>圆角</span>
          </button>
          <button class="side-tool" data-feature="chamfer">
            <svg><use href="#icon-chamfer"></use></svg><span>倒角</span>
          </button>
        </section>
        <section class="feature-tree-section">
          <div class="section-heading">
            <h2>特征树</h2>
            <button class="icon-button small" data-action="tree-menu" title="特征树菜单">
              <svg><use href="#icon-more"></use></svg>
            </button>
          </div>
          <ol id="feature-tree" class="feature-tree">
            <li class="tree-empty">等待草图</li>
          </ol>
        </section>
        <div class="left-footer">
          <button class="icon-button" data-action="new" title="新建">
            <svg><use href="#icon-plus"></use></svg>
          </button>
          <button class="icon-button" data-action="project-import" title="导入">
            <svg><use href="#icon-folder"></use></svg>
          </button>
          <button class="icon-button" data-action="save" title="保存">
            <svg><use href="#icon-save"></use></svg>
          </button>
        </div>
      </aside>

      <main class="workspace">
        <div id="viewport" class="viewport">
          <canvas id="cad-canvas" aria-label="三维模型视图"></canvas>
          <svg
            id="sketch-overlay"
            class="sketch-overlay"
            aria-label="草图绘制区域"
          ></svg>
          <div id="empty-state" class="empty-state">
            <svg><use href="#icon-sketch"></use></svg>
            <h1>从一张草图开始</h1>
            <p>选择“矩形”并在画布拖动，或载入四孔板示例。</p>
            <button class="primary-button" data-action="example">载入示例零件</button>
          </div>
          <div class="view-cube" aria-hidden="true">
            <span class="cube-top">上</span>
            <span class="cube-front">前</span>
            <span class="cube-side">右</span>
          </div>
          <div class="camera-tools" aria-label="视图工具">
            <button class="icon-button active" data-camera="orbit" title="旋转视图">
              <svg><use href="#icon-orbit"></use></svg>
            </button>
            <button class="icon-button" data-camera="fit" title="适应窗口">
              <svg><use href="#icon-fit"></use></svg>
            </button>
            <span></span>
            <button class="icon-button" data-camera="zoom-in" title="放大">
              <svg><use href="#icon-zoom-in"></use></svg>
            </button>
            <button class="icon-button" data-camera="zoom-out" title="缩小">
              <svg><use href="#icon-zoom-out"></use></svg>
            </button>
            <button class="icon-button" data-camera="isometric" title="等轴测">
              <svg><use href="#icon-cube"></use></svg>
            </button>
          </div>
          <div id="loading-state" class="loading-state" hidden>
            <span class="spinner"></span>
            <span>OCCT 正在重算…</span>
          </div>
        </div>
      </main>

      <aside class="inspector">
        <section class="inspector-section">
          <h2>参数</h2>
          <label>长度 <span><input data-param="width" type="number" min="1" step="1" value="100" /> mm</span></label>
          <label>宽度 <span><input data-param="depth" type="number" min="1" step="1" value="50" /> mm</span></label>
          <label>厚度 <span><input data-param="thickness" type="number" min="0.1" step="1" value="20" /> mm</span></label>
          <label>孔径 <span><input data-param="holeDiameter" type="number" min="0" step="0.5" value="6" /> mm</span></label>
          <label>圆角 <span><input data-param="filletRadius" type="number" min="0" step="0.5" value="5" /> mm</span></label>
        </section>
        <section class="inspector-section print-check">
          <div class="section-heading">
            <h2>打印自检</h2>
            <span id="check-status" class="check-state neutral">待检查</span>
          </div>
          <dl>
            <div><dt>模型水密</dt><dd id="metric-watertight">—</dd></div>
            <div><dt>非流形边</dt><dd id="metric-nonmanifold">—</dd></div>
            <div><dt>开放边</dt><dd id="metric-open">—</dd></div>
            <div><dt>最小壁厚</dt><dd id="metric-wall">—</dd></div>
            <div><dt>体积</dt><dd id="metric-volume">—</dd></div>
          </dl>
          <button class="secondary-button full" data-action="print-check">重新检查</button>
        </section>
        <section class="inspector-section export-panel">
          <h2>导出</h2>
          <div class="export-grid">
            <button data-export="stl">STL <small>(.stl)</small></button>
            <button data-export="3mf">3MF <small>(.3mf)</small></button>
            <button data-export="step">STEP <small>(.step)</small></button>
            <button data-export="obj">OBJ <small>(.obj)</small></button>
          </div>
        </section>
      </aside>

      <footer class="statusbar">
        <span id="status-message">就绪</span>
        <span class="status-spacer"></span>
        <span>单位：mm</span>
        <span id="selection-status">选择：0</span>
        <span id="coordinate-status">X: —　Y: —　Z: —</span>
        <button class="icon-button tiny" data-action="fullscreen" title="全屏">
          <svg><use href="#icon-fullscreen"></use></svg>
        </button>
      </footer>
    </div>

    <dialog id="dimension-dialog">
      <form method="dialog">
        <h2>修改尺寸</h2>
        <label>
          <span id="dimension-label">尺寸</span>
          <span class="dimension-input">
            <input id="dimension-value" type="number" min="0.1" step="0.1" />
            <b>mm</b>
          </span>
        </label>
        <div class="dialog-actions">
          <button value="cancel" class="secondary-button">取消</button>
          <button value="confirm" class="primary-button">应用</button>
        </div>
      </form>
    </dialog>

    <dialog id="export-dialog">
      <form method="dialog">
        <div class="dialog-heading">
          <h2>导出模型</h2>
          <button value="cancel" class="icon-button">
            <svg><use href="#icon-close"></use></svg>
          </button>
        </div>
        <p>导出前将自动检查模型水密性、尺寸和壁厚。</p>
        <div class="export-options">
          <button value="stl" data-export="stl">二进制 STL <small>常用切片格式</small></button>
          <button value="3mf" data-export="3mf">3MF <small>含单位与模型信息</small></button>
          <button value="step" data-export="step">STEP <small>继续机械编辑</small></button>
          <button value="obj" data-export="obj">OBJ <small>通用三角网格</small></button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <span class="toast-icon">
        <svg><use href="#icon-check"></use></svg>
      </span>
      <div><strong id="toast-title">完成</strong><p id="toast-message"></p></div>
      <button class="icon-button" data-action="close-toast">
        <svg><use href="#icon-close"></use></svg>
      </button>
    </div>

    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-cube" viewBox="0 0 24 24">
        <path d="m12 2 8 4.5v9L12 20l-8-4.5v-9L12 2Z" />
        <path d="m4 6.5 8 4.5 8-4.5M12 11v9" />
      </symbol>
      <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM15 3v5h4" /></symbol>
      <symbol id="icon-template" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14M9 10h11" /></symbol>
      <symbol id="icon-save" viewBox="0 0 24 24"><path d="M5 3h12l3 3v15H4V3h1Zm3 0v6h8V3M7 21v-8h10v8" /></symbol>
      <symbol id="icon-undo" viewBox="0 0 24 24"><path d="m9 7-5 5 5 5M5 12h8a6 6 0 0 1 6 6" /></symbol>
      <symbol id="icon-redo" viewBox="0 0 24 24"><path d="m15 7 5 5-5 5m4-5h-8a6 6 0 0 0-6 6" /></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16" /></symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 20h16" /></symbol>
      <symbol id="icon-line" viewBox="0 0 24 24"><path d="M5 19 19 5M4 17v3h3M17 4h3v3" /></symbol>
      <symbol id="icon-rectangle" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" /></symbol>
      <symbol id="icon-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" /></symbol>
      <symbol id="icon-dimension" viewBox="0 0 24 24"><path d="M5 7v10M19 7v10M5 12h14m-11-3-3 3 3 3m8-6 3 3-3 3" /></symbol>
      <symbol id="icon-extrude" viewBox="0 0 24 24"><path d="m5 8 7-4 7 4-7 4-7-4Zm0 0v8l7 4 7-4V8M12 12v8" /></symbol>
      <symbol id="icon-revolve" viewBox="0 0 24 24"><path d="M6 7a8 8 0 0 1 12 2m0-4v4h-4M18 17a8 8 0 0 1-12-2m0 4v-4h4" /></symbol>
      <symbol id="icon-cut" viewBox="0 0 24 24"><path d="m5 8 7-4 7 4-7 4-7-4Zm0 0v8l7 4 7-4V8M8 18 18 7" /></symbol>
      <symbol id="icon-fillet" viewBox="0 0 24 24"><path d="M5 19V9a4 4 0 0 1 4-4h10M9 19V10a1 1 0 0 1 1-1h9" /></symbol>
      <symbol id="icon-chamfer" viewBox="0 0 24 24"><path d="M5 19V9l4-4h10M9 19v-8l2-2h8" /></symbol>
      <symbol id="icon-export" viewBox="0 0 24 24"><path d="M5 4h9v6h6v10H5zM14 4l6 6M9 15h7m-3-3 3 3-3 3" /></symbol>
      <symbol id="icon-printer" viewBox="0 0 24 24"><path d="M7 8V3h10v5M6 17H4v-7h16v7h-2M7 14h10v7H7z" /></symbol>
      <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z" /></symbol>
      <symbol id="icon-sketch" viewBox="0 0 24 24"><path d="M4 18 18 4l2 2L6 20H4v-2ZM13 5l6 6M8 20h12" /></symbol>
      <symbol id="icon-orbit" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M4 12c0-4 3.5-7 8-7s8 3 8 7-3.5 7-8 7-8-3-8-7Zm13-8 3 1-1 3" /></symbol>
      <symbol id="icon-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></symbol>
      <symbol id="icon-zoom-in" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" /><path d="m15 15 5 5M7 10h6M10 7v6" /></symbol>
      <symbol id="icon-zoom-out" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6" /><path d="m15 15 5 5M7 10h6" /></symbol>
      <symbol id="icon-fullscreen" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="m8 12 3 3 5-6" /></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></symbol>
    </svg>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
